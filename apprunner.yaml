version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - echo "Installing dependencies..."
      - npm install
      - echo "Building Next.js application..."
      - npx next build
      - echo "Build completed successfully"
    post_build:
      - echo "Verifying build..."
      - ls -la .next/
run:
  runtime-version: 18
  command: npx next start
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production