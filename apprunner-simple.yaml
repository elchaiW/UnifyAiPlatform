# Simplified App Runner config - Alternative approach
version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm install --production=false
      - npm run build
run:
  runtime-version: 18
  command: node dist/index.js
  network:
    port: 5000
    env: PORT
  env:
    - name: NODE_ENV
      value: production