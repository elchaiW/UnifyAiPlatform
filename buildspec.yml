# Alternative buildspec for AWS CodeBuild/App Runner
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Node.js dependencies..."
      - npm ci --only=production
      
  build:
    commands:
      - echo "Building Next.js application..."
      - npx next build
      - echo "Build completed successfully"
      - ls -la .next/
      
  post_build:
    commands:
      - echo "Build phase completed"

artifacts:
  files:
    - '**/*'
    - .next/**/*
    - public/**/*
  base-directory: '.'