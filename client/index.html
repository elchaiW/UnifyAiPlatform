<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LUMINADOC - Multi-AI Assistant</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LUMINADOC" />
    <link rel="apple-touch-icon" href="/attached_assets/Group 1171274849 (1)_1753432882218.png" />
    <link rel="icon" type="image/png" href="/attached_assets/Group 1171274849 (1)_1753432882218.png" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#1f2937" />
    <meta name="msapplication-TileColor" content="#1f2937" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="LUMINADOC - Intelligent AI routing platform that automatically selects the best AI model for your requests. Process documents with Claude, ChatGPT, Gemini, and Grok." />
    <meta name="keywords" content="AI, artificial intelligence, document processing, multi-AI, ChatGPT, Claude, Gemini, Grok, productivity" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Safe Area Insets for iOS -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      
      .safe-area-pt { padding-top: max(var(--sat), 1rem); }
      .safe-area-pb { padding-bottom: max(var(--sab), 1rem); }
      .safe-area-pl { padding-left: max(var(--sal), 1rem); }
      .safe-area-pr { padding-right: max(var(--sar), 1rem); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA: Service Worker registered successfully');
            })
            .catch((error) => {
              console.log('PWA: Service Worker registration failed');
            });
        });
      }
    </script>
    
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
